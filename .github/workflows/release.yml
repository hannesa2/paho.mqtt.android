name: Release

on:
  push:
    tags:
      - '*'

jobs:
  build:
    name: Publish release
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Check pre-release
        run: |
          echo "tag=${{ github.ref_name }}"
          if [[ ${{ github.ref_name }} == *alpha* || ${{ github.ref_name }} == *beta* ]]
          then
             prerelease=true
          else
             prerelease=false
          fi
          echo "PRE_RELEASE=$prerelease" >> $GITHUB_ENV
          echo "prerelease=$prerelease"
      - name: Install JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Install Android SDK
        uses: hannesa2/action-android/install-sdk@0.18.1
      - name: Build project
        run: ./gradlew assembleRelease
        env:
          VERSION: ${{ github.ref_name }}
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ env.PRE_RELEASE }}
          name: ${{ github.ref_name }}
          files: |
            ./serviceLibrary/build/outputs/aar/serviceLibrary-release.aar
        env:
          GITHUB_TOKEN: ${{ secrets.CLASSIC_TOKEN }}
